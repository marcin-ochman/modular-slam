site_name: Modular SLAM
theme:
  name: material
  features:
    - toc.follow
    - toc.integrate
    - navigation.footer
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - content.code.annotate
    - content.code.copy
    - version
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/lightbulb
        name: Switch to dark mode

    - media: "(prefers-color-scheme: dark)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/lightbulb-outline
        name: Switch to light mode

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.blocks.caption
  - attr_list
  - md_in_html
  - toc:
      permalink: "#"

docs_dir: docs

plugins:
  - search
  - mike
  - autorefs
  - mkdocstrings:
      handlers:
        python:
          paths: [src/python]
          options:
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            docstring_style: google
            show_source: true
            show_root_heading: true

  - mkdoxy:
      projects:
        cpp_core:
          src-dirs: src/cpp
          full-doc: True
          doxy-cfg:
            PROJECT_NAME: "Core C++"
            FILE_PATTERNS: "*.hpp *.h *.cpp"
            RECURSIVE: YES

nav:
  - Home: index.md
  - C++:
      - Overview:
          - API:
              - Slam: cpp_core/classSlam.md
  - Python:
      - Overview: python/py_api.md

extra:
  version:
    provider: mike

extra_css:
  - css/styles.css
