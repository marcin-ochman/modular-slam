name: CMake

on: [push, pull_request]

env:
  BUILD_TYPE: Release

jobs:
  build:
    runs-on: ubuntu-latest
    environment: modular-slam-ci
    container:
      image: ghcr.io/marcin-ochman/modular_slam:1.0.0-24102025-dev
      credentials:
        username: marcin-ochman
        password: ${{ secrets.container_registry_token }}

    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies with conan
        shell: bash
        run: |
          conan profile detect
          conan install . --build=missing -of conan_build -s build_type=RelWithDebInfo
          source conan_build/build/RelWithDebInfo/generators/conanbuild.sh

      - name: Configure CMake
        shell: bash
        run: |
          source conan_build/build/RelWithDebInfo/generators/conanbuild.sh
          cmake --preset=coverage -DWARNINGS_AS_ERRORS=ON

      - name: Build
        shell: bash
        run: |
          source conan_build/build/RelWithDebInfo/generators/conanbuild.sh
          cmake --build --preset=coverage -j

      - name: Test and Coverage
        shell: bash
        run: |
          source conan_build/build/RelWithDebInfo/generators/conanbuild.sh
          ctest --preset=coverage
          gcovr -j ${{env.nproc}} --exclude 'tests/.*' --print-summary --html --html-details -o coverage_report/index.html --build-directory conan_build/build/RelWithDebInfo

  code-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Run clang-format
        uses: jidicula/clang-format-action@v4.15.0
        with:
          clang-format-version: "20"
