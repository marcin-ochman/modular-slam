[project]
name = "modular-slam"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "conan>=2.10"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.args = ["--preset", "release-python-conan"]

[tool.scikit-build.wheel.packages]
modular_slam = "src/python/modular_slam"

[tool.scikit-build.cmake.define]
MODULAR_SLAM_BUILD_PYTHON_BINDINGS = "ON"
BUILD_TESTNG = "OFF"

[dependency-groups]
dev = [
    "mike>=2.1.3",
    "mkdocs>=1.6.1",
    "mkdocs-autorefs>=1.4.3",
    "mkdocs-material>=9.7.0",
    "mkdocstrings>=0.30.1",
    "mkdocstrings-python>=1.19.0",
    "mkdoxy>=1.2.8",
    "pytest>=9.0.1",
]
